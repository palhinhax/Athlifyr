<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose Estimator</title>
  <style>
    body { margin:0; padding:16px; background:#111; color:#eee; font-family:system-ui; }
    #status { font-size:14px; margin-bottom:8px; }
    #progress { font-size:13px; color:#aaa; }
    canvas, video { display:none; }
  </style>
</head>
<body>
  <div id="status">Loading model…</div>
  <div id="progress"></div>
  <video id="video" playsinline muted crossorigin="anonymous"></video>
  <canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<script>
// ── Configuration (set by RN via postMessage) ────────────────────────
let CONFIG = {
  videoUri: '',
  startMs: 0,
  endMs: 5000,
  sampleFps: 8,
};

const KEYPOINT_NAMES = [
  'nose','left_eye','right_eye','left_ear','right_ear',
  'left_shoulder','right_shoulder','left_elbow','right_elbow',
  'left_wrist','right_wrist','left_hip','right_hip',
  'left_knee','right_knee','left_ankle','right_ankle'
];

const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('canvas');
const ctx = canvasEl.getContext('2d');

let detector = null;

// ── Send message back to React Native ────────────────────────────────
function sendToRN(payload) {
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify(payload));
  }
}

// ── Load model ───────────────────────────────────────────────────────
async function loadModel() {
  statusEl.textContent = 'Loading TensorFlow.js…';
  await tf.ready();
  statusEl.textContent = 'Loading MoveNet model…';

  detector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    {
      modelType: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER,
      enableSmoothing: true,
    }
  );

  statusEl.textContent = 'Model ready. Waiting for video…';
  sendToRN({ type: 'MODEL_READY' });
}

// ── Process video ────────────────────────────────────────────────────
async function processVideo() {
  const { videoUri, startMs, endMs, sampleFps } = CONFIG;
  const segmentDurationMs = endMs - startMs;
  const intervalMs = 1000 / sampleFps;
  const totalSamples = Math.ceil(segmentDurationMs / intervalMs) + 1;

  statusEl.textContent = 'Loading video…';

  // Load the video
  return new Promise((resolve, reject) => {
    videoEl.src = videoUri;
    videoEl.preload = 'auto';

    videoEl.onerror = () => {
      const err = 'Failed to load video in WebView.';
      sendToRN({ type: 'POSE_ERROR', error: err });
      reject(new Error(err));
    };

    videoEl.onloadedmetadata = async () => {
      const vw = videoEl.videoWidth;
      const vh = videoEl.videoHeight;
      canvasEl.width = vw;
      canvasEl.height = vh;

      statusEl.textContent = 'Analysing pose…';
      const poseFrames = [];

      for (let i = 0; i < totalSamples; i++) {
        const tInSegment = i * intervalMs;
        const absoluteTime = startMs + tInSegment;
        if (absoluteTime > endMs) break;

        // Seek video
        videoEl.currentTime = absoluteTime / 1000;

        // Wait for the seek to complete
        await new Promise((res) => {
          const onSeeked = () => {
            videoEl.removeEventListener('seeked', onSeeked);
            res();
          };
          videoEl.addEventListener('seeked', onSeeked);
        });

        // Draw frame to canvas
        ctx.drawImage(videoEl, 0, 0, vw, vh);

        // Run pose detection
        try {
          const poses = await detector.estimatePoses(canvasEl);
          if (poses.length > 0) {
            const keypoints = poses[0].keypoints.map((kp, idx) => ({
              name: KEYPOINT_NAMES[idx] || kp.name || ('kp_' + idx),
              x: kp.x / vw,
              y: kp.y / vh,
              score: kp.score || 0,
            }));
            poseFrames.push({ t: Math.round(tInSegment), keypoints });
          }
        } catch (e) {
          // Skip frame on error, continue
          console.warn('Pose estimation failed for frame', i, e);
        }

        // Update progress
        const pct = Math.round(((i + 1) / totalSamples) * 100);
        progressEl.textContent = pct + '% (' + (i + 1) + '/' + totalSamples + ')';
        sendToRN({ type: 'POSE_PROGRESS', progress: pct, current: i + 1, total: totalSamples });

        // Yield to prevent UI freeze
        await new Promise(r => setTimeout(r, 10));
      }

      statusEl.textContent = 'Done! ' + poseFrames.length + ' frames analysed.';
      sendToRN({
        type: 'POSE_RESULT',
        data: {
          poseFrames,
          meta: {
            videoWidth: vw,
            videoHeight: vh,
            sampleFps,
            totalSamples: poseFrames.length,
            segmentDurationMs,
          },
        },
      });
      resolve();
    };
  });
}

// ── Listen for messages from React Native ────────────────────────────
document.addEventListener('message', handleMessage);
window.addEventListener('message', handleMessage);

function handleMessage(event) {
  try {
    const msg = JSON.parse(event.data);
    if (msg.type === 'START_ANALYSIS') {
      CONFIG = { ...CONFIG, ...msg.config };
      processVideo().catch((err) => {
        sendToRN({ type: 'POSE_ERROR', error: String(err) });
      });
    }
  } catch (e) {
    // ignore non-JSON messages
  }
}

// ── Initialize ───────────────────────────────────────────────────────
loadModel().catch((err) => {
  sendToRN({ type: 'POSE_ERROR', error: 'Model load failed: ' + String(err) });
});
</script>
</body>
</html>
