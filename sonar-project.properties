sonar.projectName=Athlifyr

# Sources to analyse
sonar.sources=app,components,hooks,lib,providers,types,i18n.ts,middleware.ts

# Test directories
sonar.tests=__tests__,tests

# File exclusions (build artifacts, generated files, third-party)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/out/**,\
  **/*.d.ts,\
  **/prisma/migrations/**,\
  **/public/**,\
  **/mobile/**,\
  **/live/**,\
  **/__mocks__/**,\
  **/jest.config.js,\
  **/jest.setup.ts,\
  **/playwright.config.ts,\
  **/next.config.mjs,\
  **/postcss.config.mjs,\
  **/tailwind.config.ts

# Test file exclusions from main analysis
sonar.test.exclusions=\
  **/__tests__/**,\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage report (generated by jest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript
sonar.javascript.environments=browser,node
