# ============================================================================
# Athlifyr Live — Docker Compose (desenvolvimento local)
# Levanta o servidor live (Fastify + Socket.io) + Redis
#
# Uso:
#   docker compose up -d          → inicia em background
#   docker compose logs -f        → ver logs
#   docker compose down           → parar e remover containers
#   docker compose down -v        → parar e remover containers + volumes
# ============================================================================

services:
  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: athlifyr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Live Server ──────────────────────────────────────────────────────────
  live:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athlifyr-live
    restart: unless-stopped
    ports:
      - "${LIVE_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LIVE_PORT: 4000
      LIVE_HOST: 0.0.0.0
      LIVE_CORS_ORIGINS: ${LIVE_CORS_ORIGINS:-http://localhost:3000,http://localhost:4000}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_API_URL: ${NEXT_API_URL:-http://host.docker.internal:3000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
    driver: local
