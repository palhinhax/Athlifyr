name: Android Production Build (AAB)

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"

  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build Android AAB
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android AAB (Production)
        run: eas build --platform android --profile production --non-interactive

      - name: Get build URL
        if: success()
        run: |
          echo "✅ Android production AAB build submitted successfully!"
          echo "Check build status at: https://expo.dev/accounts/joaomduart/projects/athlifyr/builds"
