name: Android Production Build (AAB)

on:
  push:
    branches:
      - production/mobile
    paths:
      - "mobile/**"

  workflow_dispatch:

jobs:
  build-android-aab:
    name: Build Android AAB
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Sync version from web
        run: |
          WEB_VERSION=$(node -p "require('../package.json').version")
          echo "Syncing mobile version to web version: $WEB_VERSION"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$WEB_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "✅ Mobile version synced to $WEB_VERSION"

      - name: Build Android AAB (Production)
        run: eas build --platform android --profile production --non-interactive

      - name: Submit to Google Play Store
        if: success()
        run: eas submit --platform android --profile production --non-interactive --latest

      - name: Get build URL
        if: success()
        run: |
          echo "✅ Android production AAB built and submitted to Google Play Store!"
          echo "Check build status at: https://expo.dev/accounts/joaomduart/projects/athlifyr/builds"
