<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Signature — Athlifyr</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 40px;
      background: #f0f0f0;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <!--
      ╔══════════════════════════════════════════════════════════╗
      ║  ATHLIFYR — EMAIL SIGNATURE                              ║
      ║  Copiar o conteúdo dentro de <table id="signature">      ║
      ║  e colar diretamente no editor de assinatura do Outlook  ║
      ╚══════════════════════════════════════════════════════════╝
    -->

    <!-- WRAPPER: border simulado com tabela exterior -->
    <table
      id="signature"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        color: #1a1f2e;
        max-width: 460px;
        width: 460px;
        border-collapse: collapse;
        border: 1px solid #e8eaed;
        border-radius: 14px;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      "
    >
      <tr>
        <!-- PADDING WRAPPER — Outlook only respects padding on <td> -->
        <td
          style="
            padding: 20px 24px 16px 24px;
            background: #ffffff;
            border-radius: 14px;
          "
        >
          <!-- INNER TABLE -->
          <table
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              border-collapse: collapse;
              mso-table-lspace: 0pt;
              mso-table-rspace: 0pt;
            "
          >
            <!-- LOGO ATHLIFYR -->
            <tr>
              <td style="padding-bottom: 16px">
                <table cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      style="
                        font-size: 22px;
                        font-weight: 700;
                        letter-spacing: -0.5px;
                        color: #f0a830;
                        line-height: 1;
                      "
                    >
                      Ath
                    </td>
                    <td
                      style="
                        font-size: 22px;
                        font-weight: 700;
                        letter-spacing: -0.5px;
                        color: #c87e20;
                        line-height: 1;
                      "
                    >
                      lifyr
                    </td>
                    <td style="padding-left: 10px; vertical-align: middle">
                      <span
                        style="
                          font-size: 10px;
                          color: #9ca3af;
                          letter-spacing: 0.5px;
                          font-style: italic;
                        "
                        >one place. all sports.</span
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- DIVIDER -->
            <tr>
              <td style="padding-bottom: 16px">
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%"
                >
                  <tr>
                    <td style="height: 1px; background: #e8eaed"></td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- MAIN ROW: Avatar | Info -->
            <tr>
              <td>
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%"
                >
                  <tr>
                    <!-- INFO -->
                    <td style="vertical-align: top">
                      <!-- NOME -->
                      <p
                        style="
                          margin: 0 0 2px 0;
                          font-size: 15px;
                          font-weight: 700;
                          color: #1a1f2e;
                          letter-spacing: -0.3px;
                        "
                      >
                        João Duarte
                      </p>

                      <!-- EQUIPA -->
                      <p
                        style="
                          margin: 0 0 12px 0;
                          font-size: 11px;
                          font-weight: 500;
                          color: #c87e20;
                          letter-spacing: 0.6px;
                          text-transform: uppercase;
                        "
                      >
                        Equipa Athlifyr
                      </p>

                      <!-- CONTACTOS -->
                      <table cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td style="padding: 3px 0">
                            <table cellpadding="0" cellspacing="0" border="0">
                              <tr>
                                <td
                                  style="
                                    width: 16px;
                                    vertical-align: middle;
                                    font-size: 12px;
                                    color: #c87e20;
                                  "
                                >
                                  ✉
                                </td>
                                <td style="padding-left: 7px; font-size: 12px">
                                  <a
                                    href="mailto:hello@athlifyr.com"
                                    style="
                                      color: #c87e20;
                                      text-decoration: none;
                                    "
                                  >
                                    hello@athlifyr.com
                                  </a>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>

                        <!-- WEBSITE -->
                        <tr>
                          <td style="padding: 3px 0">
                            <table cellpadding="0" cellspacing="0" border="0">
                              <tr>
                                <td
                                  style="
                                    width: 16px;
                                    vertical-align: middle;
                                    font-size: 12px;
                                    color: #c87e20;
                                  "
                                >
                                  🌐
                                </td>
                                <td style="padding-left: 7px; font-size: 12px">
                                  <a
                                    href="https://www.athlifyr.com"
                                    style="
                                      color: #c87e20;
                                      text-decoration: none;
                                    "
                                  >
                                    www.athlifyr.com
                                  </a>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>

                      <!-- SOCIAL ICONS — PNG images (Outlook does not render inline SVG) -->
                      <table
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="margin-top: 12px"
                      >
                        <tr>
                          <!-- Instagram -->
                          <td style="padding-right: 6px">
                            <a
                              href="https://www.instagram.com/athlifyr"
                              style="text-decoration: none"
                            >
                              <table cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                  <td
                                    width="28"
                                    height="28"
                                    style="
                                      width: 28px;
                                      height: 28px;
                                      background: #fdf8f2;
                                      border: 1px solid #e8eaed;
                                      border-radius: 7px;
                                      text-align: center;
                                      vertical-align: middle;
                                    "
                                  >
                                    <img
                                      src="https://cdn-icons-png.flaticon.com/512/174/174855.png"
                                      width="16"
                                      height="16"
                                      alt="Instagram"
                                      style="
                                        display: block;
                                        margin: 6px auto;
                                        width: 16px;
                                        height: 16px;
                                      "
                                    />
                                  </td>
                                </tr>
                              </table>
                            </a>
                          </td>

                          <!-- TikTok -->
                          <td>
                            <a
                              href="https://www.tiktok.com/@athlifyr"
                              style="text-decoration: none"
                            >
                              <table cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                  <td
                                    width="28"
                                    height="28"
                                    style="
                                      width: 28px;
                                      height: 28px;
                                      background: #fdf8f2;
                                      border: 1px solid #e8eaed;
                                      border-radius: 7px;
                                      text-align: center;
                                      vertical-align: middle;
                                    "
                                  >
                                    <img
                                      src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"
                                      width="16"
                                      height="16"
                                      alt="TikTok"
                                      style="
                                        display: block;
                                        margin: 6px auto;
                                        width: 16px;
                                        height: 16px;
                                      "
                                    />
                                  </td>
                                </tr>
                              </table>
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- BOTTOM DIVIDER + DISCLAIMER -->
            <tr>
              <td style="padding-top: 16px">
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 100%"
                >
                  <tr>
                    <td style="height: 1px; background: #e8eaed"></td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 8px 0 0 0;
                    font-size: 10px;
                    color: #9ca3af;
                    line-height: 1.5;
                  "
                >
                  Este email e eventuais anexos são confidenciais e destinam-se
                  exclusivamente ao destinatário. Se recebeu este email por
                  engano, agradecemos que nos contacte e proceda à sua
                  eliminação.
                </p>
              </td>
            </tr>
          </table>
          <!-- /INNER TABLE -->
        </td>
      </tr>
    </table>
    <!-- /WRAPPER -->
  </body>
</html>
