name: Android Dev Build (APK)

on:
  push:
    branches:
      - dev
    paths:
      - "mobile/**"

  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (Dev)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Sync version from web
        run: |
          WEB_VERSION=$(node -p "require('../package.json').version")
          BUILD_NUMBER=$(node -p "require('./app.json').expo.android.versionCode")
          echo "Syncing mobile version to web version: $WEB_VERSION (Build: $BUILD_NUMBER)"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$WEB_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "✅ Mobile version synced to $WEB_VERSION (Build: $BUILD_NUMBER)"

      - name: Build Android APK (Preview)
        run: eas build --platform android --profile preview --non-interactive

      - name: Get build URL
        if: success()
        run: |
          echo "✅ Android dev APK built successfully!"
          echo "📱 Download APK at: https://expo.dev/accounts/joaomduart/projects/athlifyr/builds"
          echo ""
          echo "🔗 You can also download it directly from EAS:"
          echo "   eas build:list --platform android --buildProfile preview --limit 1"

      - name: Comment on commit
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const message = `✅ **Android Dev APK Build Successful!**
            
            📱 **Download your APK:** [EAS Build Dashboard](https://expo.dev/accounts/joaomduart/projects/athlifyr/builds)
            
            Build triggered by commit: \`${sha.substring(0, 7)}\``;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: message
            });
