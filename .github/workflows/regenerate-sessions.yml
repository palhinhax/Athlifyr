name: Regenerate Recurring Sessions

on:
  schedule:
    # Run every Monday at 3:00 AM UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: # Allow manual trigger

jobs:
  regenerate-sessions:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        run: |
          echo "🔐 Validating required secrets..."

          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "❌ ERROR: APP_URL secret is not configured"
            exit 1
          fi
          echo "✅ APP_URL is configured"

          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "❌ ERROR: CRON_SECRET secret is not configured"
            exit 1
          fi
          echo "✅ CRON_SECRET is configured"

          echo ""
          echo "📍 Target URL: ${{ secrets.APP_URL }}/api/cron/regenerate-sessions"
          echo ""
          echo "🔍 Debug info:"
          echo "   APP_URL length: ${#APP_URL}"
          echo "   CRON_SECRET length: ${#CRON_SECRET}"
          echo "   First 10 chars of secret: ${CRON_SECRET:0:10}***"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Trigger Session Regeneration
        run: |
          echo "🔄 Starting session regeneration..."
          echo "📅 Current time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          # Make the API request with detailed output (GET request, not POST!)
          response=$(curl -sS -L -w "\n---HTTP_CODE---%{http_code}---REDIRECT_URL---%{url_effective}---TIME_TOTAL---%{time_total}s" \
            -X GET "${{ secrets.APP_URL }}/api/cron/regenerate-sessions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          # Parse response parts
          body=$(echo "$response" | sed 's/---HTTP_CODE---.*//g')
          http_code=$(echo "$response" | grep -oP '(?<=---HTTP_CODE---)\d+')
          final_url=$(echo "$response" | grep -oP '(?<=---REDIRECT_URL---).*?(?=---TIME_TOTAL---)')
          time_total=$(echo "$response" | grep -oP '(?<=---TIME_TOTAL---).*')

          echo "📊 Request Details:"
          echo "   Final URL: $final_url"
          echo "   HTTP Status: $http_code"
          echo "   Time: $time_total"
          echo ""
          echo "📦 Response Body:"
          echo "$body" | jq . 2>/dev/null || echo "$body"
          echo ""

          # Validate response
          if [ "$http_code" != "200" ]; then
            echo "❌ Session regeneration failed with HTTP status $http_code"
            exit 1
          fi

          # Parse and display stats if JSON
          if echo "$body" | jq -e '.stats' > /dev/null 2>&1; then
            total=$(echo "$body" | jq -r '.stats.totalActivities // .stats.total // "N/A"')
            created=$(echo "$body" | jq -r '.stats.sessionsCreated // .stats.created // "N/A"')
            skipped=$(echo "$body" | jq -r '.stats.sessionsSkipped // .stats.skipped // "N/A"')
            
            echo "📈 Statistics:"
            echo "   Total Activities: $total"
            echo "   Sessions Created: $created"
            echo "   Sessions Skipped: $skipped"
          fi

          echo ""
          echo "✅ Session regeneration completed successfully!"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
