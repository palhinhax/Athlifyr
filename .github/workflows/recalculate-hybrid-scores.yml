name: Recalculate Hybrid Scores

on:
  schedule:
    # Run daily at 5:00 AM UTC
    - cron: "0 5 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  recalculate-hybrid-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Secrets
        run: |
          echo "🔐 Validating required secrets..."

          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "❌ ERROR: APP_URL secret is not configured"
            exit 1
          fi
          echo "✅ APP_URL is configured"

          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "❌ ERROR: CRON_SECRET secret is not configured"
            exit 1
          fi
          echo "✅ CRON_SECRET is configured"

          echo ""
          echo "📍 Target URL: ${{ secrets.APP_URL }}/api/cron/recalculate-hybrid-scores"

      - name: Recalculate Hybrid Scores
        run: |
          echo "🏋️ Starting hybrid score recalculation..."
          echo "📅 Current time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          response=$(curl -sS -L -w "\n---HTTP_CODE---%{http_code}---TIME_TOTAL---%{time_total}s" \
            -X GET "${{ secrets.APP_URL }}/api/cron/recalculate-hybrid-scores" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | sed 's/---HTTP_CODE---.*//g')
          http_code=$(echo "$response" | grep -oP '(?<=---HTTP_CODE---)\d+')
          time_total=$(echo "$response" | grep -oP '(?<=---TIME_TOTAL---).*')

          echo "📊 Request Details:"
          echo "   HTTP Status: $http_code"
          echo "   Time: $time_total"
          echo ""
          echo "📦 Response:"
          echo "$body" | jq . 2>/dev/null || echo "$body"
          echo ""

          if [ "$http_code" != "200" ]; then
            echo "❌ Hybrid score recalculation failed with HTTP status $http_code"
            exit 1
          fi

          echo "✅ Hybrid score recalculation completed successfully!"
